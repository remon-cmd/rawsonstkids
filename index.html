<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>iRSK</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"/>
<style>
  body{background:linear-gradient(135deg,#fff9f0,#f0f8ff);min-height:100vh;margin:0;-webkit-text-size-adjust:100%}
  *{box-sizing:border-box}
  input,select,textarea,button{font-family:inherit}

  /* Prevent iOS auto-zoom on focus: inputs need 16px minimum.
     Apply on all sizes, harmless on desktop. */
  input,select,textarea{font-size:16px}

  /* ── Mobile (≤ 768px) ─────────────────────────────────────── */
  @media (max-width: 768px){
    /* Root app container padding */
    #root > div[style*="max-width"]{padding:8px !important}

    /* ── Header ──────────────────────────────────────────────── */
    /* The main header bar has a 4px red top border + flex-wrap.
       Tighten its padding and let inner blocks stack. */
    #root > div > div[style*="border-top"]:first-of-type,
    #root > div > div[style*="border-top"][style*="margin-bottom"]{
      padding:0.75rem !important;
      gap:8px !important;
    }
    /* The header's two top-level children: logo block + nav buttons.
       Make each take the full width. */
    #root > div > div[style*="border-top"][style*="margin-bottom"] > div{
      width:100% !important;
      justify-content:flex-start !important;
    }
    /* Shrink the giant K-i-d-s wordmark on mobile */
    #root > div > div[style*="border-top"][style*="margin-bottom"] div[style*="2rem"]{
      font-size:1.5rem !important;
    }
    /* Hide the vertical divider between logo and "iRSK" title */
    #root > div > div[style*="border-top"][style*="margin-bottom"] div[style*="height: 48px"]{
      display:none !important;
    }
    /* Header nav buttons — smaller padding & font, allow wrap */
    #root > div > div[style*="border-top"][style*="margin-bottom"] button{
      padding:0.4rem 0.7rem !important;
      font-size:0.75rem !important;
      white-space:nowrap;
    }

    /* ── Main two-column layouts → stack ────────────────────── */
    /* Timesheet/Summary layout (1fr 2fr) */
    div[style*="grid-template-columns: 1fr 2fr"]{
      grid-template-columns:1fr !important;
      gap:12px !important;
    }
    /* Dashboard layout (1fr 1fr) */
    div[style*="grid-template-columns: 1fr 1fr"]{
      grid-template-columns:1fr !important;
      gap:12px !important;
      height:auto !important;
    }
    /* Give Dashboard panels a usable height when stacked */
    div[style*="grid-template-columns: 1fr 1fr"] > div{
      min-height:65vh;
    }

    /* ── Stat grids 4-col → 2-col ───────────────────────────── */
    div[style*="grid-template-columns: repeat(4, 1fr)"]{
      grid-template-columns:repeat(2,1fr) !important;
      gap:8px !important;
    }
    /* Stat grids 3-col stays 3 but tighter */
    div[style*="grid-template-columns: repeat(3, 1fr)"]{
      gap:6px !important;
    }

    /* ── Timesheet day rows ─────────────────────────────────── */
    /* The fixed-width day label (6rem) takes the full first row
       so time/break inputs can wrap naturally beneath. */
    div[style*="border-radius: 0.75rem"] > div[style*="flex-wrap: wrap"] > span[style*="width: 6rem"]{
      width:100% !important;
      margin-bottom:2px;
    }
    /* Time inputs — comfortable size, prevent overflow */
    input[type="time"]{
      min-width:90px;
      font-size:14px !important;
    }
    input[type="number"]{
      font-size:14px !important;
    }

    /* ── Modals ─────────────────────────────────────────────── */
    /* Full-bleed modal width on mobile */
    div[style*="position: fixed"][style*="inset"] > div[style*="max-width"]{
      max-width:calc(100vw - 16px) !important;
    }
    /* Modal padding tighten */
    div[style*="position: fixed"][style*="inset"] > div[style*="border-radius: 1rem"] > div[style*="padding: 1.25rem"]{
      padding:0.875rem !important;
    }

    /* ── Print Preview overlay ──────────────────────────────── */
    /* Header bar inside the print preview */
    div[style*="position: fixed"][style*="z-index: 50"] > div[style*="flex-wrap: wrap"]:first-child{
      padding:0.5rem 0.75rem !important;
      gap:8px !important;
    }
    /* The right-side button group breaks to new line */
    div[style*="position: fixed"][style*="z-index: 50"] > div:first-child > div[style*="margin-left: auto"]{
      margin-left:0 !important;
      width:100%;
      justify-content:space-between !important;
      flex-wrap:wrap;
    }
    /* Reduce padding around the print preview document */
    div[style*="position: fixed"][style*="z-index: 50"] > div[style*="overflow-y: auto"]{
      padding:8px !important;
    }
    div[style*="position: fixed"][style*="z-index: 50"] #print-area{
      padding:14px !important;
    }

    /* ── Message bubbles wider on narrow screens ────────────── */
    div[style*="max-width: 80%"]{max-width:90% !important}

    /* ── Tap targets ────────────────────────────────────────── */
    button{min-height:36px}

    /* PIN pad keys size up slightly */
    div[style*="grid-template-columns: repeat(3, 1fr)"] button[style*="aspect-ratio: 1.4"]{
      aspect-ratio:1.5 !important;
    }
  }

  /* ── Small tablet (769–960px) ─────────────────────────────── */
  @media (min-width: 769px) and (max-width: 960px){
    div[style*="grid-template-columns: 1fr 2fr"]{
      grid-template-columns:1fr 1.5fr !important;
    }
  }

  @media print{body *{visibility:hidden}#print-area,#print-area *{visibility:visible}#print-area{position:fixed;left:0;top:0;width:100%;padding:20px;background:white}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const BRAND="#e8192c";
const DAY_STATUS=["Worked","Sick Leave","Annual Leave","Day Off","Public Holiday","Weekend"];
const SUPA_URL="https://wehdixyjikcpzrfzdqid.supabase.co";
const SUPA_KEY="sb_publishable_MjdJzhaqvCa-RAinDWyUPg_42rXv0_u";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{
  auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},
  global:{headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}}
});

// ── Sydney Time ───────────────────────────────────────────────
const SYD="Australia/Sydney";
const nowSyd=()=>new Date(new Date().toLocaleString("en-US",{timeZone:SYD}));
const todaySyd=()=>{const d=nowSyd();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const timeSyd=()=>nowSyd().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit",hour12:true});
const fmtDate=(fs,off=0)=>{if(!fs)return"—";const d=new Date(fs+"T12:00:00");d.setDate(d.getDate()+off);return d.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"long",year:"numeric"});};
const fmtShort=(fs,off=0)=>{if(!fs)return"—";const d=new Date(fs+"T12:00:00");d.setDate(d.getDate()+off);return d.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short",year:"numeric"});};
const fmtDay=(i,fs)=>{if(!fs)return"Day "+(i+1);const d=new Date(fs+"T12:00:00");d.setDate(d.getDate()+i);return d.toLocaleDateString("en-AU",{timeZone:SYD,weekday:"short",day:"numeric",month:"short"});};
const fmtGen=()=>nowSyd().toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short",year:"numeric"});

// ── Helpers ───────────────────────────────────────────────────
const roundBrk=m=>Math.ceil((parseInt(m)||0)/5)*5;
const toHM=m=>Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";
const toDec=m=>(m/60).toFixed(2);
const decToHM=d=>{const t=parseFloat(d);if(isNaN(t))return"—";const h=Math.floor(t);const m=Math.round((t-h)*60);return h+"h "+String(m).padStart(2,"0")+"m";};
const toKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const f2b=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
const defDay=(we=false)=>({status:we?"Weekend":"Worked",start:"",end:"",breakMins:"",decimalHours:""});
const isWE=(i,fs)=>{if(!fs)return false;const d=new Date(fs+"T12:00:00");d.setDate(d.getDate()+i);return d.getDay()===0||d.getDay()===6;};
const makeFN=(fs="")=>Array.from({length:14},(_,i)=>({...defDay(isWE(i,fs)),dayIndex:i}));
const safeSh=days=>Array.isArray(days)&&days.length===14?days:makeFN();
const calcH=(s,e,b)=>{if(!s||!e)return null;const[sh,sm]=s.split(":").map(Number);const[eh,em]=e.split(":").map(Number);const m=(eh*60+em)-(sh*60+sm)-roundBrk(b);return m<0?null:m;};
const sCol=s=>({"Worked":"#eff6ff;#bfdbfe","Sick Leave":"#fff1f2;#fecdd3","Annual Leave":"#f0fdf4;#bbf7d0","Day Off":"#f9fafb;#e5e7eb","Public Holiday":"#fefce8;#fef08a","Weekend":"#f1f5f9;#cbd5e1"}[s]||"#f9fafb;#e5e7eb").split(";");
const sBadge=s=>({"Worked":{background:"#dbeafe",color:"#1d4ed8"},"Sick Leave":{background:"#fee2e2",color:"#dc2626"},"Annual Leave":{background:"#dcfce7",color:"#16a34a"},"Day Off":{background:"#f3f4f6",color:"#9ca3af"},"Public Holiday":{background:"#fef9c3",color:"#b45309"},"Weekend":{background:"#e2e8f0",color:"#64748b"}}[s]||{background:"#f3f4f6",color:"#9ca3af"});

// ── CSV/XLSX Parser ───────────────────────────────────────────
const parseTm=t=>{if(!t)return"";t=String(t).trim();const ap=t.match(/(\d+):(\d+)\s*(AM|PM)/i);if(ap){let h=parseInt(ap[1]);const p=ap[3].toUpperCase();if(p==="PM"&&h!==12)h+=12;if(p==="AM"&&h===12)h=0;return String(h).padStart(2,"0")+":"+ap[2];}const pl=t.match(/(\d+):(\d+)/);if(pl)return String(parseInt(pl[1])).padStart(2,"0")+":"+pl[2];return"";};
const parseDt=d=>{if(!d)return null;const p=String(d).trim().split("/");if(p.length===3)return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));return null;};
const descSt=desc=>{const d=String(desc||"").trim().toLowerCase();if(d.includes("sick"))return"Sick Leave";if(d.includes("annual")||d.includes("leave"))return"Annual Leave";if(d.includes("public")||d.includes("holiday")||d==="ph")return"Public Holiday";if(d===""||d==="off"||d==="day off")return"Day Off";return"Worked";};
function parseFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const isCSV=file.name.toLowerCase().endsWith(".csv");
        let rows;
        if(isCSV){const text=new TextDecoder("utf-8").decode(new Uint8Array(e.target.result));rows=text.split(/\r?\n/).map(l=>l.split(",").map(c=>c.trim().replace(/^"|"$/g,"")));}
        else{const wb=XLSX.read(e.target.result,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}).map(r=>r.map(c=>String(c||"").trim()));}
        const result={};let cur=null;
        const DAYS=["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
        for(let i=0;i<rows.length;i++){
          const row=rows[i].map(c=>String(c||"").trim());
          const ne=row.filter(c=>c!=="");if(!ne.length)continue;
          const j=row.join(",").toLowerCase();
          if(j.includes("total hours")||j.includes("week begin")||j.includes("arrival time")||j.includes("actual start")||row[0].toLowerCase()==="staff")continue;
          const di=row.findIndex(c=>/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(c));
          if(di>=0){
            if(!cur)continue;
            const dateObj=parseDt(row[di]);if(!dateObj)continue;
            const st=parseTm(row[6]);const en=parseTm(row[9]);
            const lunch=roundBrk(parseInt(row[7])||0);
            let status=descSt(row[4]||"");
            let dec=0;
            if(st&&en){const[sh,sm]=st.split(":").map(Number);const[eh,em]=en.split(":").map(Number);const net=(eh*60+em)-(sh*60+sm)-lunch;if(net>0)dec=net/60;}
            if(status==="Worked"&&dec<=0)status="Day Off";
            result[cur][toKey(dateObj)]={status,start:status==="Worked"?st:"",end:status==="Worked"?en:"",breakMins:status==="Worked"?String(lunch):"",decimalHours:status==="Worked"?dec.toFixed(2):""};
          }else{
            const isDay=DAYS.some(d=>row[0].toLowerCase().startsWith(d));
            if(ne.length===1&&row[0]&&!isDay&&!/^\d/.test(row[0])){cur=row[0];if(!result[cur])result[cur]={};}
          }
        }
        if(!Object.keys(result).length)throw new Error("No staff found in file.");
        let allDates=[];Object.values(result).forEach(emp=>allDates.push(...Object.keys(emp)));allDates.sort();
        const[fy,fm,fd]=allDates[0].split("-").map(Number);
        const mon=new Date(fy,fm-1,fd,12,0,0);const dow=mon.getDay();mon.setDate(mon.getDate()-(dow===0?6:dow===1?0:dow-1));
        const final={};
        Object.entries(result).forEach(([emp,dm])=>{
          final[emp]=Array.from({length:14},(_,idx)=>{
            const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+idx);
            if(d.getDay()===0||d.getDay()===6)return{...defDay(true)};
            const key=toKey(d);
            return dm[key]?{...defDay(false),...dm[key]}:{...defDay(false),status:"Day Off"};
          });
        });
        resolve({data:final,fortnightStart:toKey(mon)});
      }catch(err){reject(err);}
    };
    reader.onerror=reject;reader.readAsArrayBuffer(file);
  });
}

// ── Modals ────────────────────────────────────────────────────
function Modal({title,onClose,children,footer,maxWidth=440}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:16}}>
      <div style={{background:"white",borderRadius:"1rem",boxShadow:"0 20px 60px rgba(0,0,0,0.2)",width:"100%",maxWidth,maxHeight:"90vh",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"1.25rem",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <span style={{fontWeight:700,fontSize:"1.1rem"}}>{title}</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#94a3b8"}}>✕</button>
        </div>
        <div style={{padding:"1.25rem",flex:1,overflowY:"auto"}}>{children}</div>
        {footer&&<div style={{padding:"1rem",borderTop:"1px solid #e2e8f0",flexShrink:0}}>{footer}</div>}
      </div>
    </div>
  );
}

// ── PIN Pad Component ─────────────────────────────────────────
function PinPad({value,onChange,maxLength=6}){
  const tap=n=>{if(value.length<maxLength)onChange(value+n);};
  const del=()=>onChange(value.slice(0,-1));
  const clear=()=>onChange("");
  const dots=Array.from({length:maxLength},(_,i)=>i<value.length);
  const keyStyle={width:"100%",aspectRatio:"1.4",borderRadius:"0.75rem",fontSize:"1.5rem",fontWeight:600,border:"1px solid #e2e8f0",background:"white",color:"#1e293b",cursor:"pointer",userSelect:"none"};
  return(
    <div>
      <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:16}}>
        {dots.map((filled,i)=><div key={i} style={{width:14,height:14,borderRadius:"50%",background:filled?BRAND:"#e2e8f0",transition:"background 0.15s"}}/>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
        {[1,2,3,4,5,6,7,8,9].map(n=><button key={n} onClick={()=>tap(String(n))} style={keyStyle}>{n}</button>)}
        <button onClick={clear} style={{...keyStyle,fontSize:"0.75rem",color:"#94a3b8",fontWeight:500}}>Clear</button>
        <button onClick={()=>tap("0")} style={keyStyle}>0</button>
        <button onClick={del} style={{...keyStyle,fontSize:"1.25rem",color:"#94a3b8"}}>⌫</button>
      </div>
    </div>
  );
}

// ── Login ─────────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const[mode,setMode]=useState("pin");
  const[pw,setPw]=useState("");const[pin,setPin]=useState("");
  const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const goPw=async()=>{
    setLoading(true);setErr("");
    try{
      const{data:settings}=await sb.from("settings").select("key,value");
      const sp={};(settings||[]).forEach(s=>sp[s.key]=s.value);
      if(pw.trim()===(sp["pw_admin"]||"admin123")){onLogin("admin",null);return;}
      setErr("Incorrect password. Please try again.");
    }catch(e){setErr("Connection error. Check your internet.");}
    finally{setLoading(false);}
  };
  const goPin=async p=>{
    setLoading(true);setErr("");
    try{
      const{data:settings}=await sb.from("settings").select("key,value");
      const sp={};(settings||[]).forEach(s=>sp[s.key]=s.value);
      if(p===(sp["pw_director"]||"123456")){onLogin("director",null);return;}
      const{data:emps}=await sb.from("employees").select("name,password");
      for(const emp of(emps||[])){if(emp.password&&p===emp.password.trim()){onLogin("educator",emp.name);return;}}
      setErr("Incorrect PIN. Please try again.");setPin("");
    }catch(e){setErr("Connection error. Check your internet.");}
    finally{setLoading(false);}
  };
  useEffect(()=>{if(mode==="pin"&&pin.length===6){goPin(pin);}},[pin,mode]);
  const tabStyle=active=>({flex:1,padding:"0.5rem",fontSize:"0.8rem",fontWeight:600,border:"none",cursor:"pointer",background:active?BRAND:"#f1f5f9",color:active?"white":"#64748b",borderRadius:"0.5rem"});
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"white",borderRadius:"1.25rem",boxShadow:"0 10px 40px rgba(0,0,0,0.12)",padding:28,width:"100%",maxWidth:360}}>
        <div style={{textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:"2.5rem",fontWeight:900}}><span style={{color:"#e8192c"}}>K</span><span style={{color:"#f59e0b"}}>i</span><span style={{color:"#3b82f6"}}>d</span><span style={{color:"#22c55e"}}>s</span></div>
          <p style={{fontSize:"0.7rem",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"#3b82f6",marginTop:4}}>Rawson St Early Learning Centre</p>
          <p style={{color:"#64748b",fontSize:"0.875rem",marginTop:10}}>iRSK</p>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:18,background:"#f8fafc",padding:4,borderRadius:"0.6rem"}}>
          <button onClick={()=>{setMode("pin");setErr("");setPw("");}} style={tabStyle(mode==="pin")}>🔢 PIN</button>
          <button onClick={()=>{setMode("password");setErr("");setPin("");}} style={tabStyle(mode==="password")}>🔑 Password</button>
        </div>
        {mode==="pin"?<>
          <p style={{textAlign:"center",fontSize:"0.75rem",color:"#64748b",marginBottom:14}}>Enter your 6-digit PIN</p>
          <PinPad value={pin} onChange={setPin}/>
          {err&&<p style={{color:"#ef4444",fontSize:"0.75rem",textAlign:"center",marginTop:10}}>{err}</p>}
          {loading&&<p style={{color:"#64748b",fontSize:"0.75rem",textAlign:"center",marginTop:10}}>Checking...</p>}
        </>:<>
          <label style={{fontSize:"0.75rem",color:"#64748b",display:"block",marginBottom:4}}>Admin Password</label>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&goPw()} placeholder="Enter password..." autoFocus
            style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.5rem 0.75rem",fontSize:"0.875rem",boxSizing:"border-box",outline:"none",marginBottom:8}}/>
          {err&&<p style={{color:"#ef4444",fontSize:"0.75rem",marginBottom:8}}>{err}</p>}
          <button onClick={goPw} disabled={loading||!pw} style={{width:"100%",padding:"0.5rem",borderRadius:"0.5rem",background:BRAND,color:"white",fontWeight:600,fontSize:"0.875rem",border:"none",cursor:"pointer",opacity:(loading||!pw)?0.5:1,marginBottom:6}}>{loading?"Checking...":"Login"}</button>
        </>}
        <p style={{fontSize:"0.7rem",color:"#cbd5e1",textAlign:"center",marginTop:14}}>Forgot PIN? Contact Admin to reset</p>
      </div>
    </div>
  );
}

// ── Password / PIN Manager ────────────────────────────────────
function PwManager({employees,role,onClose}){
  const isAdmin=role==="admin";
  const[ap,setAp]=useState("");const[dp,setDp]=useState("");const[eps,setEps]=useState({});const[saved,setSaved]=useState("");const[err,setErr]=useState("");
  const[confirmReset,setConfirmReset]=useState(false);const[resetDone,setResetDone]=useState(false);
  const load=async()=>{const{data}=await sb.from("settings").select("key,value");const sp={};(data||[]).forEach(s=>sp[s.key]=s.value);setAp(sp["pw_admin"]||"admin123");setDp(sp["pw_director"]||"123456");const p={};employees.forEach(emp=>{p[emp.name]=emp.password||"";});setEps(p);};
  useEffect(()=>{load();},[]);
  const onlyDigits=v=>v.replace(/\D/g,"").slice(0,6);
  const save=async()=>{
    setErr("");
    for(const emp of employees){const v=eps[emp.name]||"";if(v&&v.length!==6){setErr(emp.name+"'s PIN must be exactly 6 digits.");return;}}
    if(isAdmin){
      if(dp&&dp.length!==6){setErr("Director PIN must be exactly 6 digits.");return;}

// ── Change My PIN ─────────────────────────────────────────────
function ChangeMyPw({session,onClose}){
  const[step,setStep]=useState("current");
  const[cur,setCur]=useState("");const[nw,setNw]=useState("");const[con,setCon]=useState("");
  const[err,setErr]=useState("");const[done,setDone]=useState(false);
  const verifyCurrent=async()=>{
    setErr("");
    if(session.role==="educator"){
      const{data}=await sb.from("employees").select("password").eq("name",session.empName).single();
      if(!data||cur!==(data.password||"").trim()){setErr("Current PIN is incorrect.");setCur("");return;}
    }else{
      const{data}=await sb.from("settings").select("value").eq("key","pw_director").single();
      if(!data||cur!==(data.value||"").trim()){setErr("Current PIN is incorrect.");setCur("");return;}
    }
    setStep("new");
  };
  const saveNew=async()=>{
    setErr("");
    if(nw!==con){setErr("New PINs don't match.");setCon("");return;}
    if(session.role==="educator"){await sb.from("employees").update({password:nw}).eq("name",session.empName);}
    else{await sb.from("settings").upsert({key:"pw_director",value:nw});}
    setDone(true);setTimeout(()=>onClose(),1500);
  };
  useEffect(()=>{if(step==="current"&&cur.length===6)verifyCurrent();},[cur,step]);
  useEffect(()=>{if(step==="new"&&nw.length===6)setStep("confirm");},[nw,step]);
  useEffect(()=>{if(step==="confirm"&&con.length===6)saveNew();},[con,step]);
  const title=step==="current"?"Enter Current PIN":step==="new"?"Enter New PIN":"Confirm New PIN";
  const val=step==="current"?cur:step==="new"?nw:con;
  const setVal=step==="current"?setCur:step==="new"?setNw:setCon;
  return(
    <Modal title="🔢 Change My PIN" onClose={onClose} maxWidth={340}>
      <div>
        <p style={{textAlign:"center",fontSize:"0.85rem",color:"#475569",marginBottom:14,fontWeight:600}}>{title}</p>
        <PinPad value={val} onChange={setVal}/>
        {err&&<p style={{color:"#ef4444",fontSize:"0.75rem",textAlign:"center",marginTop:10}}>{err}</p>}
        {done&&<p style={{color:"#16a34a",fontSize:"0.85rem",textAlign:"center",marginTop:10,fontWeight:600}}>✅ PIN changed!</p>}
        {step!=="current"&&!done&&<button onClick={()=>{setStep("current");setCur("");setNw("");setCon("");setErr("");}} style={{width:"100%",marginTop:10,padding:"0.4rem",borderRadius:"0.5rem",background:"#f1f5f9",color:"#64748b",border:"none",cursor:"pointer",fontSize:"0.75rem"}}>← Start over</button>}
      </div>
    </Modal>
  );
}

          <button onClick={post} disabled={posting||(!txt.trim()&&!file)} style={{marginLeft:"auto",padding:"0.375rem 1rem",borderRadius:"0.5rem",background:BRAND,color:"white",fontWeight:600,fontSize:"0.875rem",border:"none",cursor:"pointer",opacity:(posting||(!txt.trim()&&!file))?0.4:1,flexShrink:0}}>{posting?"Posting...":"Post"}</button>
        </div>
      </div>}
      <div style={{flex:1,overflowY:"auto",padding:"0.75rem 1rem",display:"flex",flexDirection:"column",gap:10}}>
        {posts.length===0
          ?<div style={{textAlign:"center",color:"#94a3b8",padding:"3rem 0"}}><div style={{fontSize:"2.5rem",marginBottom:8}}>📋</div><p style={{fontSize:"0.875rem"}}>No announcements yet</p></div>
          :posts.map(p=>{
            const{bg,c}=rb(p.role);
            const dt=new Date(p.created_at);
            const dStr=dt.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short",year:"numeric"});
            const tStr=dt.toLocaleTimeString("en-AU",{timeZone:SYD,hour:"2-digit",minute:"2-digit"});
            return(<div key={p.id} style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:"0.875rem",padding:"0.75rem 1rem"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                <span style={{fontSize:"0.7rem",fontWeight:700,padding:"1px 8px",borderRadius:999,background:bg,color:c}}>{p.sender}</span>
                <span style={{fontSize:"0.65rem",color:"#94a3b8"}}>{dStr} · {tStr}</span>
                {canDel(p)&&<button onClick={()=>del(p.id)} style={{marginLeft:"auto",background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",fontSize:"0.75rem"}}>✕</button>}
              </div>
              {p.text&&<p style={{fontSize:"0.875rem",color:"#1e293b",lineHeight:1.6,margin:0,whiteSpace:"pre-wrap"}}>{p.text}</p>}
              {p.file&&p.file.type==="image"&&<img src={p.file.data} alt={p.file.name} style={{maxWidth:"100%",borderRadius:8,marginTop:p.text?8:0,border:"1px solid #e2e8f0"}}/>}
              {p.file&&p.file.type==="file"&&<a href={p.file.data} download={p.file.name} style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:p.text?8:0,fontSize:"0.8rem",color:"#3b82f6",textDecoration:"none",background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"4px 10px"}}>📄 {p.file.name}</a>}
            </div>);
          })
        }
      </div>
    </div>
  );
}

// ── Message Board ─────────────────────────────────────────────
function Messages({session}){
  const todayKey=()=>todaySyd();
  const[sel,setSel]=useState(todayKey());const[msgs,setMsgs]=useState([]);const[txt,setTxt]=useState("");
  const bottom=useRef();
  const dates=Array.from({length:7},(_,i)=>{const d=nowSyd();d.setDate(d.getDate()-i);return toKey(d);});
  const dayMsgs=msgs.filter(m=>m.date===sel).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const rb=role=>({admin:{bg:"#fee2e2",c:"#e8192c"},director:{bg:"#dbeafe",c:"#1d4ed8"},educator:{bg:"#dcfce7",c:"#15803d"}}[role]||{bg:"#f1f5f9",c:"#475569"});
  const isOwn=s=>s===(session.role==="educator"?session.empName:session.role==="admin"?"Admin":"Director");
  const load=async()=>{const{data}=await sb.from("messages").select("*").order("created_at",{ascending:true});setMsgs(data||[]);};
  useEffect(()=>{load();const sub=sb.channel("msgs_ch").on("postgres_changes",{event:"*",schema:"public",table:"messages"},()=>load()).subscribe();return()=>sb.removeChannel(sub);},[]);
  const send=async()=>{
    if(!txt.trim())return;
    const{error}=await sb.from("messages").insert({sender:session.role==="educator"?session.empName:session.role==="admin"?"Admin":"Director",role:session.role,text:txt.trim(),date:todayKey(),time:timeSyd()});
    if(error){alert("Error: "+error.message);return;}
    setTxt("");await load();setTimeout(()=>bottom.current?.scrollIntoView({behavior:"smooth"}),100);
  };
  const del=async id=>{await sb.from("messages").delete().eq("id",id);setMsgs(m=>m.filter(x=>x.id!==id));};
  const printMsgs=()=>{
    const dl=sel===todayKey()?"Today":new Date(sel+"T12:00:00").toLocaleDateString("en-AU",{timeZone:SYD,weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const rows=dayMsgs.map(m=>{const{bg,c}=rb(m.role);return"<tr><td style='padding:6px 10px;border:1px solid #e2e8f0;font-size:11px;white-space:nowrap'><span style='background:"+bg+";color:"+c+";padding:2px 8px;border-radius:999px;font-weight:700;font-size:10px'>"+m.sender+"</span></td><td style='padding:6px 10px;border:1px solid #e2e8f0;font-size:11px;color:#64748b;white-space:nowrap'>"+m.time+"</td><td style='padding:6px 10px;border:1px solid #e2e8f0;font-size:11px'>"+m.text+"</td></tr>";}).join("");
    const html="<!DOCTYPE html><html><head><title>iRSK Messages</title><style>body{font-family:Arial,sans-serif;font-size:12px;color:#1e293b;margin:24px}h1{color:"+BRAND+";font-size:18px;margin:0}table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#f1f5f9;text-align:left;padding:6px 10px;font-size:11px;color:#475569;border:1px solid #e2e8f0}.footer{margin-top:24px;font-size:10px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:8px}</style></head><body><h1>iRSK — Message Board</h1><p style='color:#64748b;font-size:11px;margin:4px 0 0'>Rawson St Kids Early Learning Centre</p><p style='color:#334155;font-size:12px;margin:6px 0 0'><strong>"+dl+"</strong> · "+dayMsgs.length+" message"+(dayMsgs.length!==1?"s":"")+"</p><table><thead><tr><th>Sender</th><th>Time</th><th>Message</th></tr></thead><tbody>"+rows+"</tbody></table><div class='footer'>Generated by iRSK · "+fmtGen()+"</div><script>setTimeout(function(){window.print();},400);<\/script></body></html>";
    const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();}
  };
  return(
    <div style={{background:"white",borderRadius:"1rem",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",display:"flex",flexDirection:"column",height:"100%",borderTop:"3px solid #3b82f6",borderRadius:"1rem"}}>
      <div style={{padding:"0.875rem 1rem",borderBottom:"1px solid #e2e8f0",fontWeight:700,fontSize:"1rem",color:"#1e293b",flexShrink:0}}>💬 Messages</div>
      <div style={{padding:"0.5rem 1rem",borderBottom:"1px solid #e2e8f0",display:"flex",gap:6,flexWrap:"wrap",flexShrink:0,alignItems:"center"}}>
        {dates.map(d=>{const label=d===todayKey()?"Today":new Date(d+"T12:00:00").toLocaleDateString("en-AU",{timeZone:SYD,weekday:"short",day:"numeric",month:"short"});const has=msgs.some(m=>m.date===d);return(<button key={d} onClick={()=>setSel(d)} style={{position:"relative",padding:"3px 10px",borderRadius:999,fontSize:"0.75rem",fontWeight:sel===d?700:400,border:"1px solid "+(sel===d?BRAND:"#e2e8f0"),background:sel===d?BRAND:"white",color:sel===d?"white":"#475569",cursor:"pointer"}}>{label}{has&&<span style={{position:"absolute",top:-3,right:-3,width:8,height:8,background:"#3b82f6",borderRadius:"50%",border:"1px solid white"}}></span>}</button>);})}
        <input type="date" value={sel} onChange={e=>setSel(e.target.value)} style={{padding:"3px 8px",borderRadius:999,fontSize:"0.75rem",border:"1px solid #e2e8f0",color:"#475569",outline:"none"}}/>
        {dayMsgs.length>0&&<button onClick={printMsgs} style={{marginLeft:"auto",padding:"3px 12px",borderRadius:"0.5rem",fontSize:"0.75rem",fontWeight:500,border:"1px solid #e2e8f0",background:"white",color:"#475569",cursor:"pointer"}}>🖨️ Print</button>}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"0.75rem 1rem",display:"flex",flexDirection:"column",gap:10}}>
        {dayMsgs.length===0
          ?<div style={{textAlign:"center",color:"#94a3b8",padding:"3rem 0"}}><div style={{fontSize:"2.5rem",marginBottom:8}}>💬</div><p style={{fontSize:"0.875rem"}}>No messages for {sel===todayKey()?"today":new Date(sel+"T12:00:00").toLocaleDateString("en-AU",{timeZone:SYD,weekday:"long",day:"numeric",month:"long"})}</p></div>
          :dayMsgs.map(m=>{const{bg,c}=rb(m.role);const own=isOwn(m.sender);return(
            <div key={m.id} style={{display:"flex",flexDirection:"column",alignItems:own?"flex-end":"flex-start"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                <span style={{fontSize:"0.7rem",fontWeight:700,padding:"1px 8px",borderRadius:999,background:bg,color:c}}>{m.sender}</span>
                <span style={{fontSize:"0.65rem",color:"#94a3b8"}}>{m.time}</span>
                {(session.role==="admin"||own)&&<button onClick={()=>del(m.id)} style={{fontSize:"0.65rem",background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",padding:0}}>✕</button>}
              </div>
              <div style={{maxWidth:"80%",background:own?"#fee2e2":"#f1f5f9",padding:"0.5rem 0.875rem",fontSize:"0.9rem",color:"#1e293b",lineHeight:1.5,border:own?"1px solid #fecaca":"1px solid #e2e8f0",borderRadius:own?"1rem 1rem 0.25rem 1rem":"1rem 1rem 1rem 0.25rem"}}>{m.text}</div>
            </div>
          );})}
        <div ref={bottom}/>
      </div>
      <div style={{padding:"0.75rem 1rem",borderTop:"1px solid #e2e8f0",display:"flex",gap:8,flexShrink:0,alignItems:"flex-end"}}>
        <textarea value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&(e.preventDefault(),send())} placeholder="Type a message... (Enter to send)" rows={2}
          style={{flex:1,border:"1px solid #e2e8f0",borderRadius:"0.75rem",padding:"0.625rem 0.875rem",fontSize:"1rem",outline:"none",resize:"none",lineHeight:1.5}}/>
        <button onClick={send} disabled={!txt.trim()} style={{padding:"0.625rem 1.25rem",borderRadius:"0.75rem",background:BRAND,color:"white",fontWeight:600,fontSize:"1rem",border:"none",cursor:"pointer",opacity:!txt.trim()?0.4:1,flexShrink:0}}>Send</button>
      </div>
    </div>
  );
}

// ── Shopping Lists ────────────────────────────────────────────
// Supabase table required:
//   create table shopping_items (
//     id bigserial primary key,
//     store text not null,           -- 'woolworths' or 'tassaway'
//     name text not null,
//     qty text,
//     added_by text,
//     created_at timestamptz default now()
//   );
function ShoppingList({store,storeLabel,storeIcon,accentColor,session}){
  const[items,setItems]=useState([]);
  const[name,setName]=useState("");
  const[qty,setQty]=useState("");
  const[adding,setAdding]=useState(false);
  const senderName=session.role==="educator"?session.empName:session.role==="admin"?"Admin":"Director";
  const load=async()=>{
    const{data}=await sb.from("shopping_items").select("*").eq("store",store).order("created_at",{ascending:true});
    setItems(data||[]);
  };
  useEffect(()=>{
    load();
    const sub=sb.channel("shop_ch_"+store).on("postgres_changes",{event:"*",schema:"public",table:"shopping_items",filter:"store=eq."+store},()=>load()).subscribe();
    return()=>sb.removeChannel(sub);
  },[store]);
  const add=async()=>{
    if(!name.trim())return;
    setAdding(true);
    const{error}=await sb.from("shopping_items").insert({store,name:name.trim(),qty:qty.trim()||null,added_by:senderName});
    if(error){alert("Error adding item: "+error.message);setAdding(false);return;}
    setName("");setQty("");setAdding(false);await load();
  };
  const check=async id=>{
    // Optimistic remove so it feels instant; auto-delete on check
    setItems(it=>it.filter(x=>x.id!==id));
    await sb.from("shopping_items").delete().eq("id",id);
  };
  const fmtTime=ts=>{
    if(!ts)return"";
    const d=new Date(ts);
    return d.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("en-AU",{timeZone:SYD,hour:"2-digit",minute:"2-digit",hour12:true});
  };
  return(
    <div style={{background:"white",borderRadius:"1rem",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",display:"flex",flexDirection:"column",height:"100%",borderTop:"3px solid "+accentColor,borderRadius:"1rem"}}>
      <div style={{padding:"0.875rem 1rem",borderBottom:"1px solid #e2e8f0",fontWeight:700,fontSize:"1rem",color:"#1e293b",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
        <span>{storeIcon} {storeLabel}</span>
        <span style={{fontSize:"0.75rem",fontWeight:500,color:"#94a3b8",background:"#f1f5f9",padding:"2px 10px",borderRadius:999}}>{items.length} item{items.length!==1?"s":""}</span>
      </div>
      <div style={{padding:"0.75rem 1rem",borderBottom:"1px solid #e2e8f0",flexShrink:0}}>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Add an item..." style={{flex:1,border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.5rem 0.75rem",fontSize:"0.875rem",outline:"none",minWidth:0}}/>
          <input value={qty} onChange={e=>setQty(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Qty" style={{width:70,border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.5rem 0.75rem",fontSize:"0.875rem",outline:"none"}}/>
          <button onClick={add} disabled={adding||!name.trim()} style={{padding:"0.5rem 1rem",borderRadius:"0.5rem",background:accentColor,color:"white",fontWeight:600,fontSize:"0.875rem",border:"none",cursor:"pointer",opacity:(adding||!name.trim())?0.4:1,flexShrink:0}}>+</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"0.75rem 1rem",display:"flex",flexDirection:"column",gap:6}}>
        {items.length===0
          ?<div style={{textAlign:"center",color:"#94a3b8",padding:"2.5rem 0"}}><div style={{fontSize:"2.5rem",marginBottom:8}}>{storeIcon}</div><p style={{fontSize:"0.875rem",margin:0}}>List is empty</p><p style={{fontSize:"0.75rem",margin:"4px 0 0"}}>Add items above</p></div>
          :items.map(it=>(
            <div key={it.id} style={{display:"flex",alignItems:"center",gap:10,background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:"0.75rem",padding:"0.625rem 0.875rem"}}>
              <button onClick={()=>check(it.id)} aria-label="Check off" style={{flexShrink:0,width:24,height:24,minHeight:24,borderRadius:6,border:"2px solid #cbd5e1",background:"white",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,transition:"all 0.15s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor=accentColor;e.currentTarget.style.background=accentColor+"15";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#cbd5e1";e.currentTarget.style.background="white";}}>
                <span style={{fontSize:"0.85rem",color:accentColor,fontWeight:700,opacity:0}}>✓</span>
              </button>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontSize:"0.9rem",fontWeight:500,color:"#1e293b"}}>{it.name}</span>
                  {it.qty&&<span style={{fontSize:"0.75rem",fontWeight:600,color:accentColor,background:accentColor+"15",padding:"1px 8px",borderRadius:999}}>{it.qty}</span>}
                </div>
                <div style={{fontSize:"0.65rem",color:"#94a3b8",marginTop:2}}>Added by {it.added_by||"—"} · {fmtTime(it.created_at)}</div>
              </div>
            </div>
          ))
        }
      </div>
    </div>
  );
}

// ── Print Preview ─────────────────────────────────────────────
function PrintPreview({employees,fortnightStart,getTimesheet,getExpenses,getMedCerts,onClose}){
  const[sel,setSel]=useState("all");
  const empList=sel==="all"?employees.map(e=>e.name):[sel];
  const period=fmtDate(fortnightStart)+" – "+fmtDate(fortnightStart,13);
  const emailFn=()=>{const s=encodeURIComponent("Fortnightly Payroll Summary – "+period);const b=encodeURIComponent("Hi Remon,\n\nPlease find attached the fortnightly payroll summary for the period: "+period+"\n\nEmployee(s): "+empList.join(", ")+"\n\nKind regards");window.location.href="mailto:remon@rawsonstkids.nsw.edu.au?subject="+s+"&body="+b;};
  const printFn=()=>{const area=document.getElementById("print-area");if(!area)return;const html="<!DOCTYPE html><html><head><title>iRSK Payroll</title><style>body{font-family:Arial,sans-serif;font-size:12px;color:#1e293b;margin:24px}table{width:100%;border-collapse:collapse;margin-bottom:10px}th{background:#f1f5f9;text-align:left;padding:6px 8px;font-size:11px;color:#475569;border:1px solid #e2e8f0}td{padding:5px 8px;border:1px solid #e2e8f0;font-size:11px}img{max-width:120px;max-height:120px;object-fit:cover}@media print{body{margin:12px}}</style></head><body>"+area.innerHTML+"<script>setTimeout(function(){window.print();},500);<\/script></body></html>";const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();}};
  const td={padding:"5px 8px",border:"1px solid #e2e8f0",fontSize:"0.72rem"};
  const th={textAlign:"left",padding:"5px 8px",fontSize:"0.7rem",color:"#475569",border:"1px solid #e2e8f0",background:"#f1f5f9"};
  const dv=d=>{if(d.status==="Public Holiday")return"PH";if(d.status==="Annual Leave")return"AL";if(d.status==="Sick Leave")return"SL";if(d.status==="Day Off")return"OFF";if(d.status==="Weekend")return"—";if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null)return toDec(m);}if(d.decimalHours)return parseFloat(d.decimalHours).toFixed(2);return"—";};
  const wt=days=>days.reduce((s,d)=>{if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null)return s+m/60;}if(d.decimalHours&&d.status==="Worked")return s+parseFloat(d.decimalHours);return s;},0);
  const wl=off=>{if(!fortnightStart)return off===0?"Week 1":"Week 2";const d=new Date(fortnightStart+"T12:00:00");d.setDate(d.getDate()+off);const e=new Date(d);e.setDate(d.getDate()+4);return d.toLocaleDateString("en-AU",{timeZone:SYD,day:"2-digit",month:"2-digit"})+" – "+e.toLocaleDateString("en-AU",{timeZone:SYD,day:"2-digit",month:"2-digit"});};
  return(
    <div style={{position:"fixed",inset:0,zIndex:50,display:"flex",flexDirection:"column",background:"#f1f5f9"}}>
      <div style={{flexShrink:0,display:"flex",alignItems:"center",gap:12,padding:"0.75rem 1.25rem",background:"white",borderBottom:"1px solid #e2e8f0",flexWrap:"wrap"}}>
        <span style={{fontWeight:700,color:"#334155"}}>🖨️ Print Preview</span>
        <div style={{display:"flex",alignItems:"center",gap:8,marginLeft:8}}>
          <label style={{fontSize:"0.75rem",color:"#64748b"}}>Employee:</label>
          <select value={sel} onChange={e=>setSel(e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.25rem 0.75rem",fontSize:"0.875rem"}}>
            <option value="all">All Employees</option>{employees.map(e=><option key={e.name} value={e.name}>{e.name}</option>)}
          </select>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:8}}>
          <button onClick={emailFn} style={{padding:"0.4rem 1rem",borderRadius:"0.5rem",background:"#f1f5f9",color:"#475569",fontWeight:600,fontSize:"0.8rem",border:"none",cursor:"pointer"}}>📧 Email</button>
          <button onClick={printFn} style={{padding:"0.4rem 1rem",borderRadius:"0.5rem",background:BRAND,color:"white",fontWeight:600,fontSize:"0.8rem",border:"none",cursor:"pointer"}}>🖨️ Print / Save PDF</button>
          <button onClick={onClose} style={{padding:"0.4rem 1rem",borderRadius:"0.5rem",background:"#f1f5f9",color:"#64748b",fontSize:"0.8rem",border:"none",cursor:"pointer"}}>✕ Close</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:24,display:"flex",justifyContent:"center"}}>
        <div id="print-area" style={{background:"white",width:"100%",maxWidth:800,padding:32,borderRadius:8,boxShadow:"0 2px 16px rgba(0,0,0,0.08)",fontFamily:"Arial,sans-serif",fontSize:12,color:"#1e293b"}}>
          <div style={{marginBottom:16}}><div style={{color:BRAND,fontSize:22,fontWeight:900}}>Rawson St Kids Early Learning Centre</div><div style={{color:"#64748b",fontSize:11}}>iRSK — Fortnightly Payroll Summary</div><div style={{color:"#334155",fontSize:12,marginTop:4}}>Period: {period}</div><div style={{color:"#94a3b8",fontSize:10,marginTop:2}}>Generated: {fmtGen()}</div></div>
          {(()=>{let gt=0,ts=0,ta=0,tp=0,tw=0;empList.forEach(emp=>{const sheet=getTimesheet(emp);sheet.forEach(d=>{if(d.status==="Sick Leave")ts++;else if(d.status==="Annual Leave")ta++;else if(d.status==="Public Holiday")tp++;else if(d.status==="Worked"){tw++;if(d.start&&d.end){const[sh,sm]=d.start.split(":").map(Number);const[eh,em]=d.end.split(":").map(Number);const m=(eh*60+em)-(sh*60+sm)-roundBrk(d.breakMins);if(m>0)gt+=m/60;}else if(d.decimalHours)gt+=parseFloat(d.decimalHours)||0;}});});
          return(<div style={{background:"#f8fafc",border:"2px solid "+BRAND,borderRadius:8,padding:14,marginBottom:20}}><div style={{fontWeight:700,fontSize:13,color:"#1e293b",marginBottom:10,borderBottom:"1px solid #e2e8f0",paddingBottom:6}}>📊 Fortnight Summary — {empList.length} Staff</div><div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{[{v:gt.toFixed(2),l:"Total Hours",bg:"#fee2e2",c:BRAND},{v:(gt/Math.max(empList.length,1)).toFixed(2),l:"Avg Hrs/Staff",bg:"#fef3c7",c:"#d97706"},{v:tw,l:"Days Worked",bg:"#eff6ff",c:"#3b82f6"},{v:tp,l:"Public Holidays",bg:"#fef9c3",c:"#b45309"},{v:ta,l:"Annual Leave",bg:"#f0fdf4",c:"#16a34a"},{v:ts,l:"Sick Leave",bg:"#fff1f2",c:"#e11d48"}].map(({v,l,bg,c})=><div key={l} style={{background:bg,borderRadius:6,padding:"6px 12px",textAlign:"center",flex:1,minWidth:75}}><div style={{fontSize:17,fontWeight:800,color:c}}>{v}</div><div style={{fontSize:10,color:c,marginTop:1}}>{l}</div></div>)}</div></div>);})()}
          {empList.map((emp,ei)=>{
            const sheet=getTimesheet(emp);const w1=sheet.slice(0,5);const w2=sheet.slice(7,12);const grand=wt(w1)+wt(w2);
            const ph=sheet.filter(d=>d.status==="Public Holiday").length;const al=sheet.filter(d=>d.status==="Annual Leave").length;const sl=sheet.filter(d=>d.status==="Sick Leave").length;
            const ee=getExpenses(emp);const ec=getMedCerts(emp);const et=ee.reduce((s,e)=>s+parseFloat(e.amount),0);
            return(<div key={emp} style={{marginBottom:32,borderTop:ei>0?"2px dashed #e2e8f0":"none",paddingTop:ei>0?20:0}}>
              <div style={{fontSize:14,fontWeight:700,borderBottom:"2px solid "+BRAND,paddingBottom:4,marginBottom:10}}>{emp}</div>
              <table style={{width:"100%",borderCollapse:"collapse",marginBottom:10}}><thead><tr><th style={th}>Week</th>{["Mon","Tue","Wed","Thu","Fri"].map(d=><th key={d} style={th}>{d}</th>)}<th style={th}>Total</th></tr></thead>
              <tbody>{[{days:w1,off:0},{days:w2,off:7}].map(({days,off})=><tr key={off} style={{background:off===0?"#f8fafc":"white"}}><td style={{...td,fontWeight:600,color:"#475569"}}>{wl(off)}</td>{days.map((d,i)=><td key={i} style={{...td,color:d.status==="Public Holiday"?"#b45309":d.status==="Annual Leave"?"#15803d":d.status==="Sick Leave"?"#dc2626":d.status==="Day Off"?"#94a3b8":"#1e293b",fontWeight:d.status==="Worked"?600:"normal"}}>{dv(d)}</td>)}<td style={{...td,fontWeight:700,color:BRAND}}>{wt(days).toFixed(2)}</td></tr>)}</tbody></table>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>{[{v:grand.toFixed(2),l:"Normal Hours"},{v:ph,l:"Public Holidays"},{v:al,l:"Annual Leave"},{v:sl,l:"Sick Leave"}].map(({v,l})=><div key={l} style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:6,padding:"5px 12px",textAlign:"center",minWidth:75}}><div style={{fontSize:15,fontWeight:700,color:BRAND}}>{v}</div><div style={{fontSize:10,color:"#64748b"}}>{l}</div></div>)}</div>
              {ee.length>0&&<div style={{marginBottom:14}}><div style={{fontSize:11,fontWeight:700,color:"#475569",marginBottom:5,borderBottom:"1px solid #e2e8f0",paddingBottom:2}}>💰 Expenses</div><table style={{width:"100%",borderCollapse:"collapse",marginBottom:4}}><thead><tr>{["Date","Description","Amount","Receipt"].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead><tbody>{ee.map((ex,i)=><tr key={ex.id} style={{background:i%2===0?"white":"#f8fafc"}}><td style={td}>{ex.date}</td><td style={td}>{ex.name}</td><td style={{...td,fontWeight:600,color:BRAND}}>${ex.amount}</td><td style={td}>{ex.receipt?.type==="image"?<img src={ex.receipt.data} style={{maxWidth:90,maxHeight:90,borderRadius:4,objectFit:"cover"}}/>:ex.receipt?.type==="file"?<span>📄 {ex.receipt.name}</span>:"—"}</td></tr>)}</tbody></table><div style={{textAlign:"right",fontWeight:700,color:BRAND,fontSize:11}}>Total: ${et.toFixed(2)}</div></div>}
              {ec.length>0&&<div><div style={{fontSize:11,fontWeight:700,color:"#475569",marginBottom:6,borderBottom:"1px solid #e2e8f0",paddingBottom:2}}>🏥 Medical Certificates</div><div style={{display:"flex",flexWrap:"wrap",gap:10}}>{ec.map(c=><div key={c.id}>{c.type==="image"?<div><img src={c.data} style={{maxWidth:150,maxHeight:150,borderRadius:6,border:"1px solid #e2e8f0",objectFit:"cover"}}/><div style={{fontSize:9,color:"#64748b",marginTop:2}}>{c.name}</div></div>:<div style={{background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:6,padding:"10px 14px",fontSize:11,color:"#475569"}}>📄 {c.name}</div>}</div>)}</div></div>}
            </div>);
          })}
          <div style={{marginTop:24,fontSize:10,color:"#94a3b8",borderTop:"1px solid #e2e8f0",paddingTop:8}}>Generated by iRSK • {fmtGen()}</div>
        </div>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App(){
  const[session,setSession]=useState(null);
  const[employees,setEmployees]=useState([]);
  const[newEmp,setNewEmp]=useState("");
  const[selectedEmp,setSelectedEmp]=useState(null);
  const[timesheets,setTimesheets]=useState({});
  const[expCache,setExpCache]=useState({});
  const[mcCache,setMcCache]=useState({});
  const[fortnightStart,setFortnightStart]=useState("");
  const[view,setView]=useState("dashboard");
  const[delConfirm,setDelConfirm]=useState(null);
  const[showPw,setShowPw]=useState(false);
  const[showChangePw,setShowChangePw]=useState(false);
  const[showPrint,setShowPrint]=useState(false);
  const[showImport,setShowImport]=useState(false);
  const[expanded,setExpanded]=useState(null);
  const[loading,setLoading]=useState(true);

  const loadData=async()=>{
    setLoading(true);
    try{
      const{data:emps}=await sb.from("employees").select("*").order("name");setEmployees(emps||[]);
      const{data:settings}=await sb.from("settings").select("key,value");
      const sp={};(settings||[]).forEach(s=>sp[s.key]=s.value);
      const fs=sp["fortnight_start"]||"";setFortnightStart(fs);
      if(fs){
        const{data:ts}=await sb.from("timesheets").select("*").eq("fortnight_start",fs);
        const tsMap={};(ts||[]).forEach(t=>tsMap[t.employee_name]=safeSh(t.days));setTimesheets(tsMap);
        const{data:ex}=await sb.from("expenses").select("*").eq("fortnight_start",fs);
        const exMap={};(ex||[]).forEach(e=>exMap[e.employee_name]=e.data||[]);setExpCache(exMap);
        const{data:mc}=await sb.from("medical_certs").select("*").eq("fortnight_start",fs);
        const mcMap={};(mc||[]).forEach(m=>mcMap[m.employee_name]=m.data||[]);setMcCache(mcMap);
      }
    }catch(e){console.error(e);}
    finally{setLoading(false);}
  };

  useEffect(()=>{loadData();},[]);
  useEffect(()=>{if(session)setView("dashboard");},[session]);
  useEffect(()=>{if(session?.role==="educator")setSelectedEmp(session.empName);},[session]);

  const addEmp=async()=>{const n=newEmp.trim();if(!n||employees.find(e=>e.name===n))return;await sb.from("employees").insert({name:n,role:"educator"});setNewEmp("");await loadData();};
  const delEmp=async n=>{await sb.from("employees").delete().eq("name",n);if(selectedEmp===n)setSelectedEmp(null);setDelConfirm(null);await loadData();};
  const getTS=emp=>timesheets[emp]||makeFN(fortnightStart);
  const updDay=async(emp,idx,field,val)=>{
    const sheet=[...getTS(emp)];sheet[idx]={...sheet[idx],[field]:val};
    if(field==="status"&&val!=="Worked")sheet[idx]={...sheet[idx],start:"",end:"",breakMins:"",decimalHours:""};
    setTimesheets(t=>({...t,[emp]:sheet}));
    if(fortnightStart)await sb.from("timesheets").upsert({employee_name:emp,fortnight_start:fortnightStart,days:sheet,updated_at:new Date().toISOString()},{onConflict:"employee_name,fortnight_start"});
  };
  const setFS=async v=>{setFortnightStart(v);await sb.from("settings").upsert({key:"fortnight_start",value:v});const{data:ts}=await sb.from("timesheets").select("*").eq("fortnight_start",v);const tsMap={};(ts||[]).forEach(t=>tsMap[t.employee_name]=safeSh(t.days));setTimesheets(tsMap);};
  const doImport=async(data,fs)=>{
    for(const name of Object.keys(data)){await sb.from("employees").upsert({name,role:"educator"},{onConflict:"name",ignoreDuplicates:true});}
    if(fs){await sb.from("settings").upsert({key:"fortnight_start",value:fs});setFortnightStart(fs);}
    for(const[name,days] of Object.entries(data)){await sb.from("timesheets").upsert({employee_name:name,fortnight_start:fs||fortnightStart,days,updated_at:new Date().toISOString()},{onConflict:"employee_name,fortnight_start"});}
    await loadData();
  };
  const summ=emp=>{const s=getTS(emp);let td=0,sk=0,al=0,ph=0;s.forEach(d=>{if(d.status==="Sick Leave"){sk++;return;}if(d.status==="Annual Leave"){al++;return;}if(d.status==="Public Holiday"){ph++;return;}if(d.status==="Day Off"||d.status==="Weekend")return;if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null){td+=m/60;return;}}if(d.decimalHours){const v=parseFloat(d.decimalHours);if(!isNaN(v)&&v>0)td+=v;}});return{td,sk,al,ph};};
  const canEdit=emp=>session?.role==="admin"||session?.role==="director"||(session?.role==="educator"&&session.empName===emp);
  const canManage=session?.role==="admin";
  const visEmps=session?.role==="educator"?employees.filter(e=>e.name===session.empName):employees;
  const roleColor={admin:"#e8192c",director:"#3b82f6",educator:"#22c55e"}[session?.role];

  if(!session)return React.createElement(LoginScreen,{onLogin:(r,e)=>setSession({role:r,empName:e})});
  if(loading)return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{textAlign:"center"}}><div style={{fontSize:"2.5rem",fontWeight:900,lineHeight:1.1,marginBottom:12}}><span style={{color:"#e8192c"}}>K</span><span style={{color:"#f59e0b"}}>i</span><span style={{color:"#3b82f6"}}>d</span><span style={{color:"#22c55e"}}>s</span></div><p style={{color:"#64748b",fontSize:"0.875rem"}}>Loading iRSK...</p></div></div>);

  const btn=(label,onClick,active)=><button onClick={onClick} style={{padding:"0.4rem 0.9rem",borderRadius:"0.5rem",fontSize:"0.8rem",fontWeight:500,border:"none",cursor:"pointer",background:active?BRAND:"#f1f5f9",color:active?"white":"#475569"}}>{label}</button>;

  return(
    <div style={{padding:16,maxWidth:1200,margin:"0 auto"}}>
      {showPw&&<PwManager employees={employees} role={session.role} onClose={()=>setShowPw(false)}/>}
      {showChangePw&&<ChangeMyPw session={session} onClose={()=>setShowChangePw(false)}/>}
      {showPrint&&<PrintPreview employees={visEmps} fortnightStart={fortnightStart} getTimesheet={getTS} getExpenses={emp=>expCache[emp]||[]} getMedCerts={emp=>mcCache[emp]||[]} onClose={()=>setShowPrint(false)}/>}
      {showImport&&<ImportModal onImport={doImport} onClose={()=>setShowImport(false)}/>}

      {/* Header */}
      <div style={{background:"white",borderRadius:"1rem",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",padding:"1rem 1.25rem",marginBottom:16,borderTop:"4px solid "+BRAND,display:"flex",flexWrap:"wrap",gap:12,alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <div style={{lineHeight:1.2}}><div style={{fontSize:"0.65rem",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:"#3b82f6"}}>Rawson St</div><div style={{fontSize:"2rem",fontWeight:900,lineHeight:1}}><span style={{color:"#e8192c"}}>K</span><span style={{color:"#f59e0b"}}>i</span><span style={{color:"#3b82f6"}}>d</span><span style={{color:"#22c55e"}}>s</span></div><div style={{fontSize:"0.6rem",fontWeight:600,letterSpacing:"0.05em",color:"#3b82f6"}}>Early Learning Centre</div></div>
          <div style={{width:1,height:48,background:"#e2e8f0"}}></div>
          <div><div style={{fontWeight:700,fontSize:"1.1rem",color:"#1e293b"}}>iRSK</div><div style={{fontSize:"0.75rem",color:"#94a3b8"}}>Rawson St Kids Educators Portal</div></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:"0.7rem",fontWeight:600,padding:"0.25rem 0.75rem",borderRadius:"9999px",background:roleColor,color:"white"}}>{session.role==="educator"?session.empName+" (Educator)":{admin:"Admin",director:"Director"}[session.role]}</span>
          {btn("🏠 Dashboard",()=>setView("dashboard"),view==="dashboard")}
          {btn("🛒 Shopping",()=>setView("shopping"),view==="shopping")}
          {canManage&&btn("📋 Timesheet",()=>setView("timesheet"),view==="timesheet")}
          {canManage&&(view==="timesheet"||view==="summary")&&btn("📊 Summary",()=>setView("summary"),view==="summary")}
          {canManage&&(view==="timesheet"||view==="summary")&&btn("📥 Import",()=>setShowImport(true),false)}
          {canManage&&(view==="timesheet"||view==="summary")&&btn("🖨️ Export",()=>setShowPrint(true),false)}
          {(session.role==="admin"||session.role==="director")&&btn("🔐 Passwords",()=>setShowPw(true),false)}
          {session.role!=="admin"&&btn("🔢 My PIN",()=>setShowChangePw(true),false)}
          <button onClick={()=>setSession(null)} style={{padding:"0.4rem 0.9rem",borderRadius:"0.5rem",fontSize:"0.8rem",fontWeight:500,border:"none",cursor:"pointer",background:"#f1f5f9",color:"#ef4444"}}>Logout</button>
        </div>
      </div>

      {/* Dashboard — full width */}
      {view==="dashboard"&&<Dashboard session={session}/>}

      {/* Shopping Lists — full width */}
      {view==="shopping"&&<ShoppingLists session={session}/>}

      {/* Timesheet & Summary — with left panel */}
      {view!=="dashboard"&&view!=="shopping"&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:16}}>
          {/* Left Panel */}
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <div style={{background:"white",borderRadius:"1rem",padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
              <div style={{fontWeight:600,color:"#334155",marginBottom:12}}>👥 Employees</div>
              {canManage&&<div style={{display:"flex",gap:8,marginBottom:12}}><input value={newEmp} onChange={e=>setNewEmp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addEmp()} placeholder="Employee name..." style={{flex:1,border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.4rem 0.75rem",fontSize:"0.8rem",outline:"none"}}/><button onClick={addEmp} style={{background:BRAND,color:"white",border:"none",borderRadius:"0.5rem",padding:"0.4rem 0.75rem",fontWeight:700,cursor:"pointer",fontSize:"1rem"}}>+</button></div>}

                  <span style={{fontSize:"0.875rem",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{emp.name}</span>
                  {canManage&&(delConfirm===emp.name
                    ?<div style={{display:"flex",gap:4}} onClick={e=>e.stopPropagation()}><button onClick={()=>delEmp(emp.name)} style={{fontSize:"0.7rem",background:"#ef4444",color:"white",border:"none",borderRadius:4,padding:"2px 6px",cursor:"pointer"}}>Yes</button><button onClick={()=>setDelConfirm(null)} style={{fontSize:"0.7rem",background:"#cbd5e1",color:"#475569",border:"none",borderRadius:4,padding:"2px 6px",cursor:"pointer"}}>No</button></div>
                    :<button onClick={e=>{e.stopPropagation();setDelConfirm(emp.name);}} style={{fontSize:"0.7rem",background:selectedEmp===emp.name?"rgba(255,255,255,0.25)":"#e2e8f0",color:selectedEmp===emp.name?"white":"#94a3b8",border:"none",borderRadius:4,padding:"2px 6px",cursor:"pointer",marginLeft:8}}>✕</button>
                  )}
                </div>
              ))}
            </div>
            {canManage&&<div style={{background:"white",borderRadius:"1rem",padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
              <div style={{fontWeight:600,color:"#334155",marginBottom:12}}>📅 Fortnight Period</div>
              <label style={{fontSize:"0.75rem",color:"#64748b",display:"block",marginBottom:4}}>Start Date</label>
              <input type="date" value={fortnightStart} onChange={e=>setFS(e.target.value)} style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.4rem 0.75rem",fontSize:"0.875rem",boxSizing:"border-box",outline:"none"}}/>
              {fortnightStart&&<p style={{fontSize:"0.75rem",color:"#94a3b8",marginTop:8}}>Ends: {fmtShort(fortnightStart,13)}</p>}
            </div>}
          </div>

          {/* Right Panel */}
          <div>
            {view==="timesheet"&&!selectedEmp&&<div style={{background:"white",borderRadius:"1rem",padding:"3rem",textAlign:"center",color:"#94a3b8",boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}><div style={{fontSize:"2.5rem",marginBottom:8}}>👈</div><p>Select an employee</p></div>}
            {view==="timesheet"&&selectedEmp&&(
              <div style={{background:"white",borderRadius:"1rem",padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
                <div style={{fontWeight:600,color:BRAND,marginBottom:16,fontSize:"1rem"}}>📋 Timesheet — <span style={{color:"#1e293b"}}>{selectedEmp}</span></div>
                {getTS(selectedEmp).map((day,idx)=>{
                  const we=isWE(idx,fortnightStart);const editable=canEdit(selectedEmp)&&!we;

                  return(<div key={idx} style={{border:"1px solid "+bc,borderRadius:"0.75rem",padding:10,marginBottom:6,background:bg,opacity:we?0.65:1}}>

                      <span style={{fontSize:"0.75rem",fontWeight:600,color:we?"#94a3b8":"#475569",width:"6rem",flexShrink:0}}>{fmtDay(idx,fortnightStart)}</span>

                        :editable?<select value={day.status} onChange={e=>updDay(selectedEmp,idx,"status",e.target.value)} style={{...sb2,fontSize:"0.75rem",fontWeight:500,padding:"2px 8px",borderRadius:6,border:"none",cursor:"pointer"}}>{DAY_STATUS.filter(s=>s!=="Weekend").map(s=><option key={s}>{s}</option>)}</select>
                        :<span style={{...sb2,fontSize:"0.75rem",fontWeight:500,padding:"2px 8px",borderRadius:6}}>{day.status}</span>}
                      {day.status==="Worked"&&!we&&(<>
                        {imported?(<div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                          <span style={{fontSize:"0.75rem",fontWeight:600,padding:"2px 8px",borderRadius:6,background:"#dbeafe",color:"#1d4ed8",border:"1px solid #bfdbfe"}}>📊 {(()=>{const m=calcH(day.start,day.end,day.breakMins);return m!=null?toDec(m)+"h | "+toHM(m):decToHM(day.decimalHours);})()}</span>

                          {day.end&&<span style={{fontSize:"0.7rem",color:"#94a3b8"}}>Out: <span style={{color:"#334155",fontWeight:500}}>{day.end}</span></span>}

                        </div>):(<>
                          <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:"0.7rem",color:"#94a3b8"}}>In</span><input type="time" value={day.start} disabled={!editable} onChange={e=>updDay(selectedEmp,idx,"start",e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"2px 6px",fontSize:"0.75rem",outline:"none",background:editable?"white":"#f8fafc"}}/></div>
                          <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:"0.7rem",color:"#94a3b8"}}>Out</span><input type="time" value={day.end} disabled={!editable} onChange={e=>updDay(selectedEmp,idx,"end",e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"2px 6px",fontSize:"0.75rem",outline:"none",background:editable?"white":"#f8fafc"}}/></div>
                          <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:"0.7rem",color:"#94a3b8"}}>Break</span><input type="number" min="30" max="120" placeholder="mins" value={day.breakMins} disabled={!editable} onChange={e=>updDay(selectedEmp,idx,"breakMins",e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"2px 6px",fontSize:"0.75rem",width:56,outline:"none",background:editable?"white":"#f8fafc"}}/></div>
                          {(()=>{const m=calcH(day.start,day.end,day.breakMins);return m!=null?<span style={{marginLeft:"auto",fontSize:"0.75rem",fontWeight:600,padding:"2px 8px",borderRadius:6,background:"#fee2e2",color:BRAND}}>{toHM(m)} / {toDec(m)}h</span>:null;})()}
                        </>)}
                        {imported&&editable&&<button onClick={()=>updDay(selectedEmp,idx,"decimalHours","")} style={{marginLeft:"auto",fontSize:"0.7rem",background:"none",border:"none",cursor:"pointer",color:"#94a3b8"}}>Edit manually</button>}
                      </>)}
                      {day.status!=="Worked"&&!we&&<span style={{marginLeft:"auto",...sb2,fontSize:"0.75rem",fontWeight:500,padding:"2px 8px",borderRadius:6}}>{day.status}</span>}
                    </div>
                  </div>);
                })}
                {(()=>{const{td,sk,al,ph}=summ(selectedEmp);return(<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginTop:16}}>{[{v:td.toFixed(2),l:"Total hrs",bg:"#fee2e2",c:BRAND},{v:ph,l:"Public holidays",bg:"#fef9c3",c:"#b45309"},{v:sk,l:"Sick days",bg:"#fff1f2",c:"#e11d48"},{v:al,l:"Annual leave",bg:"#f0fdf4",c:"#16a34a"}].map(({v,l,bg,c})=><div key={l} style={{background:bg,borderRadius:"0.75rem",padding:"0.75rem",textAlign:"center"}}><div style={{fontSize:"1.25rem",fontWeight:700,color:c}}>{v}</div><div style={{fontSize:"0.7rem",color:c,marginTop:2}}>{l}</div></div>)}</div>);})()}
                <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:8}}>
                  {[{key:"expenses",label:"💰 Expenses"},{key:"medical",label:"🏥 Medical Certificates"}].map(({key,label})=>(
                    <div key={key} style={{border:"1px solid #e2e8f0",borderRadius:"0.75rem",overflow:"hidden"}}>
                      <button onClick={()=>setExpanded(expanded===key?null:key)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.75rem 1rem",background:"#f8fafc",border:"none",cursor:"pointer",fontSize:"0.875rem",fontWeight:600,color:"#334155"}}>
                        <span>{label}</span><span style={{color:"#94a3b8"}}>{expanded===key?"▲":"▼"}</span>
                      </button>
                      {expanded===key&&<div style={{padding:"0 1rem 1rem"}}>{key==="expenses"?<Expenses empName={selectedEmp} fortnightStart={fortnightStart} canEdit={canEdit(selectedEmp)}/>:<Medical empName={selectedEmp} fortnightStart={fortnightStart} canEdit={canEdit(selectedEmp)}/>}</div>}
                    </div>
                  ))}
                </div>
              </div>
            )}
            {view==="summary"&&(
              <div style={{display:"flex",flexDirection:"column",gap:16}}>
                {employees.length===0?<div style={{background:"white",borderRadius:"1rem",padding:"3rem",textAlign:"center",color:"#94a3b8"}}>No employees added yet</div>:<>
                  {(()=>{let gt=0,ts=0,ta=0,tp=0,tw=0;employees.forEach(emp=>{const{td,sk,al,ph}=summ(emp.name);gt+=td;ts+=sk;ta+=al;tp+=ph;getTS(emp.name).forEach(d=>{if(d.status==="Worked")tw++;});});
                  return(<div style={{background:"white",borderRadius:"1rem",padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)",borderLeft:"4px solid "+BRAND}}>
                    <div style={{fontWeight:700,fontSize:"1rem",color:"#1e293b",marginBottom:4}}>📊 Fortnight Summary — All Staff</div>
                    {fortnightStart&&<div style={{fontSize:"0.75rem",color:"#64748b",marginBottom:12}}>{fmtShort(fortnightStart)} – {fmtShort(fortnightStart,13)} · {employees.length} employee{employees.length!==1?"s":""}</div>}
                    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:8}}>{[{v:gt.toFixed(2),l:"Total Hours",s:"all staff",bg:"#fee2e2",c:BRAND},{v:(gt/Math.max(employees.length,1)).toFixed(2),l:"Avg Hours",s:"per employee",bg:"#fef3c7",c:"#d97706"},{v:tw,l:"Days Worked",s:"across all",bg:"#eff6ff",c:"#3b82f6"}].map(({v,l,s,bg,c})=><div key={l} style={{background:bg,borderRadius:"0.75rem",padding:"0.75rem",textAlign:"center"}}><div style={{fontSize:"1.4rem",fontWeight:800,color:c}}>{v}</div><div style={{fontSize:"0.75rem",fontWeight:600,color:c}}>{l}</div><div style={{fontSize:"0.65rem",color:c,opacity:0.7}}>{s}</div></div>)}</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>{[{v:tp,l:"Public Holidays",bg:"#fef9c3",c:"#b45309"},{v:ta,l:"Annual Leave",bg:"#f0fdf4",c:"#16a34a"},{v:ts,l:"Sick Leave",bg:"#fff1f2",c:"#e11d48"}].map(({v,l,bg,c})=><div key={l} style={{background:bg,borderRadius:"0.75rem",padding:"0.75rem",textAlign:"center"}}><div style={{fontSize:"1.4rem",fontWeight:800,color:c}}>{v}</div><div style={{fontSize:"0.75rem",fontWeight:600,color:c}}>{l}</div></div>)}</div>
                  </div>);})()}
                  {employees.map(emp=>{const{td,sk,al,ph}=summ(emp.name);const sheet=getTS(emp.name);
                    const w1=sheet.slice(0,5).reduce((s,d)=>{if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null)return s+m/60;}if(d.decimalHours&&d.status==="Worked")return s+parseFloat(d.decimalHours);return s;},0);
                    const w2=sheet.slice(7,12).reduce((s,d)=>{if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null)return s+m/60;}if(d.decimalHours&&d.status==="Worked")return s+parseFloat(d.decimalHours);return s;},0);
                    return(<div key={emp.name} style={{background:"white",borderRadius:"1rem",padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)",border:"2px solid "+(emp.name===selectedEmp?BRAND:"transparent")}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                        <div style={{fontWeight:600,fontSize:"1rem",color:"#1e293b"}}>{emp.name}</div>
                        <div style={{display:"flex",gap:6,fontSize:"0.7rem"}}><span style={{background:"#f1f5f9",color:"#64748b",padding:"2px 8px",borderRadius:999}}>Wk1: {w1.toFixed(2)}h</span><span style={{background:"#f1f5f9",color:"#64748b",padding:"2px 8px",borderRadius:999}}>Wk2: {w2.toFixed(2)}h</span></div>
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:12}}>{[{v:td.toFixed(2),l:"Total hrs",bg:"#fee2e2",c:BRAND},{v:ph,l:"Public holidays",bg:"#fef9c3",c:"#b45309"},{v:sk,l:"Sick days",bg:"#fff1f2",c:"#e11d48"},{v:al,l:"Annual leave",bg:"#f0fdf4",c:"#16a34a"}].map(({v,l,bg,c})=><div key={l} style={{background:bg,borderRadius:"0.6rem",padding:"0.5rem",textAlign:"center"}}><div style={{fontSize:"1.1rem",fontWeight:700,color:c}}>{v}</div><div style={{fontSize:"0.65rem",color:c,marginTop:1}}>{l}</div></div>)}</div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{sheet.map((d,i)=>{let val=null;if(d.status==="Worked"){if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null)val=toDec(m);}else if(d.decimalHours&&parseFloat(d.decimalHours)>0)val=parseFloat(d.decimalHours).toFixed(2);}const bg=d.status==="Sick Leave"?"#fee2e2":d.status==="Annual Leave"?"#dcfce7":d.status==="Public Holiday"?"#fef9c3":d.status==="Day Off"||d.status==="Weekend"?"#e2e8f0":val?BRAND:"#f1f5f9";const color=d.status==="Sick Leave"?"#e11d48":d.status==="Annual Leave"?"#16a34a":d.status==="Public Holiday"?"#b45309":d.status==="Day Off"||d.status==="Weekend"?"#94a3b8":val?"white":"#94a3b8";const lbl=d.status==="Sick Leave"?"SL":d.status==="Annual Leave"?"AL":d.status==="Public Holiday"?"PH":d.status==="Day Off"?"—":d.status==="Weekend"?"WE":val||"?";return<div key={i} title={fmtDay(i,fortnightStart)} style={{borderRadius:4,padding:"3px 7px",fontSize:"0.7rem",textAlign:"center",minWidth:36,background:bg,color}}>{lbl}</div>;})}</div>
                    </div>);
                  })}
                </>}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
